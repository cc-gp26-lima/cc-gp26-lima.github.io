<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Shared by link with the hotel's guests, not meant to be found by search.
         Paired with public/robots.txt; both ship in the built site. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A5%8B%3C/text%3E%3C/svg%3E"
    />
    <title>Guest Guide — Lima Grand Prix 2026</title>
    <meta
      name="description"
      content="Competition programme, how meals work and where to eat — for guests of the Lima Grand Prix 2026 staying at the Country Club Lima Hotel."
    />

    <!-- What shows when the link is pasted into WhatsApp or a message. The page
         stays out of search (see robots above); these only shape the preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lima Grand Prix 2026 · IJF World Judo Tour" />
    <meta property="og:title" content="Guest Guide — Lima Grand Prix 2026" />
    <meta
      property="og:description"
      content="Competition programme, how meals work and where to eat — for guests staying at the Country Club Lima Hotel."
    />
    <meta property="og:url" content="https://cc-gp26-lima.github.io/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_PE" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
